# Example configuration that creates one script or automation from every
# blueprint. CI validates it with Home Assistant's `check_config`
# (scripts/check-config.sh) against the stable and beta container images.
# scripts/create-blueprint.sh adds an instance here for every new blueprint.
homeassistant:
  name: Blueprint CI

input_boolean:
  example:
    name: Example (used by new blueprints from scripts/create-blueprint.sh)

script:
  courier:
    use_blueprint:
      path: mxstzdev/courier.yaml
      input:
        telegram_chats:
          - "person.marius: notify.telegram_bot_marius"
        app_overrides:
          - "person.marius: notify.mobile_app_phone"

automation:
  - id: courier_action_dispatcher
    alias: "Courier: Action Dispatcher"
    use_blueprint:
      path: mxstzdev/courier_action_dispatcher.yaml
      input:
        allowed_types: [BAT_OK, OFF_ACK, OFF_RELOAD]
