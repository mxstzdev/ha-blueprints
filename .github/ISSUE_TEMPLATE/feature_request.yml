# Feature request form. See bug_report.yml for how the blueprint label works.
name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: dropdown
    id: blueprint
    attributes:
      label: Which blueprint?
      description: A label with the blueprint name is added automatically.
      options:
        - Other / not specific to one blueprint
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation or problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How could the blueprint help? New options, behaviour, ...
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
